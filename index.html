<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04281c"><title>Keuangan Pribadi</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Keuangan">
<style>
:root{--lime:#c8ff2e;--tx:#effbe9;--mu:#9fc7a8;--gl:rgba(255,255,255,.09);--bd:rgba(255,255,255,.16);--red:#ff7a6b;--yel:#ffd84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:linear-gradient(160deg,#04281c,#0b4a2f 60%,#073b27) fixed;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
h1{font:italic 900 24px/1 system-ui;margin:0}h2{font:italic 900 22px system-ui;margin:0 0 12px}h3{font:italic 800 17px system-ui;margin:0}p{margin:6px 0}
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px 6px;max-width:960px;margin:auto}.lg{background:#fff;border-radius:16px;padding:4px 8px;height:50px;display:flex}.lg img{height:100%;border-radius:8px}
main{max-width:960px;margin:auto;padding:8px 14px}
.card{background:var(--gl);border:1px solid var(--bd);border-radius:22px;padding:14px;margin:0 0 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g2 .card{margin:0}.g3{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:8px}
.btn{border:0;border-radius:99px;background:var(--lime);color:#06260f;font:800 16px system-ui;padding:14px 20px;min-height:48px;cursor:pointer}.btn.g{background:var(--gl);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--red);color:#2b0803}.btn.s{min-height:38px;padding:6px 14px;font-size:14px}
.qb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.qb .btn{padding:24px 10px;font-size:19px}
input,select{width:100%;font:16px system-ui;color:var(--tx);background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:14px;padding:12px;min-height:46px;margin-top:4px}option{color:#000}
label{display:block;font-size:13px;color:var(--mu);margin:0 0 10px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.rw:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.pb{height:10px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--lime)}
.pos{color:var(--lime)}.neg{color:var(--red)}.nw{font:italic 900 34px system-ui;color:var(--lime)}.warn{border-color:var(--yel);color:var(--yel)}
.st{display:inline-block;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700}.st.ok{background:rgba(200,255,46,.18);color:var(--lime)}.st.w{background:rgba(255,216,74,.2);color:var(--yel)}.st.b{background:rgba(255,122,107,.2);color:var(--red)}button.st{border:0;font-family:inherit;cursor:pointer;text-align:left}
.mb{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}.mb button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--gl);color:var(--lime);font-size:22px}.mb b{font:italic 900 20px system-ui}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:11px 4px;border-radius:99px;border:1px solid var(--bd);background:none;color:var(--tx);font:700 14px system-ui}.seg .on{background:var(--lime);color:#06260f}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}.chip{border-radius:99px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);padding:9px 14px;font:600 14px system-ui;min-height:40px}.chip.on{background:var(--lime);color:#06260f;border-color:var(--lime)}
.big{font:900 32px system-ui!important;text-align:right}.acts{display:flex;gap:10px;margin-top:6px}.acts .btn{flex:1}
#sh,#lk{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}#sh[hidden],#lk[hidden],#tt[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:linear-gradient(160deg,#0a3a27,#06281b);border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#lk{z-index:50;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(160deg,#04281c,#0b4a2f)}#lk input{max-width:260px;text-align:center;font-size:24px}
#tt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;background:#fff;color:#06260f;padding:12px 16px;border-radius:99px;font-weight:700;display:flex;gap:12px;align-items:center;max-width:92vw}#tt button{border:0;background:var(--lime);border-radius:99px;padding:6px 12px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(4,40,28,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mu);font:700 11px system-ui;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}nav button span{font-size:20px}nav button.on{color:var(--lime)}
#by{position:fixed;right:10px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;background:var(--lime);color:#06260f;font:800 11px system-ui;padding:5px 11px;border-radius:99px;pointer-events:none}
@media(min-width:800px){body{padding-bottom:50px}nav{position:sticky;top:0;bottom:auto;max-width:960px;margin:6px auto;border:1px solid var(--bd);border-radius:99px;padding:6px 10px}nav button{flex-direction:row;justify-content:center;font-size:14px;gap:8px}#by{bottom:12px;z-index:30}#sh{align-items:center}.sheet{border-radius:26px}}
@media print{body{background:#fff;color:#000;padding:0}nav,#by,.hd,.noprint,.btn{display:none!important}.card{background:#fff;border:1px solid #999;color:#000;break-inside:avoid}.mu{color:#444}.pos,.neg{color:#000}}
</style></head><body>
